version: 2

# One CI runner serves this repository and a lockfile change runs the full
# browser suite, so update proposals arrive once a month in as few PRs as
# possible: all minor and patch bumps in one group, majors on their own.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    versioning-strategy: increase
    groups:
      monthly-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      monthly-updates:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
