name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Plan browser checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if test "${BASE_SHA}" = 0000000000000000000000000000000000000000 || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            printf 'vite.config.ts\0' > "${RUNNER_TEMP}/changed-files"
          elif test "${{ github.event_name }}" = pull_request; then
            git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files"
          else
            git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files"
          fi
          node scripts/ci-plan.ts "${RUNNER_TEMP}/changed-files" >> "${GITHUB_OUTPUT}"

  check:
    needs: plan
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176 dir /repo --no-banner --redact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: python
        if: needs.plan.outputs.mode != 'docs'
        with:
          path: ${{ runner.temp }}/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-material.txt') }}
      - name: Install pinned Python dependencies for the materials shelf
        if: needs.plan.outputs.mode != 'docs'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          if test "${{ steps.python.outputs.cache-hit }}" != "true"; then
            python3 -m venv "${RUNNER_TEMP}/python"
            "${RUNNER_TEMP}/python/bin/pip" install --quiet -r scripts/requirements-material.txt
          fi
          echo "${RUNNER_TEMP}/python/bin" >> "${GITHUB_PATH}"
          echo "MOLNOTES_PYTHON=${RUNNER_TEMP}/python/bin/python3" >> "${GITHUB_ENV}"
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
        if: needs.plan.outputs.mode != 'docs'
      - run: node --test tests/ci-plan.test.ts tests/checked-workflow.test.ts
        if: needs.plan.outputs.mode == 'docs'

  e2e:
    needs: plan
    if: needs.plan.outputs.mode != 'docs'
    runs-on: ubuntu-24.04-arm
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: python
        with:
          path: ${{ runner.temp }}/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-material.txt') }}
      - name: Install pinned Python dependencies
        run: |
          if test "${{ steps.python.outputs.cache-hit }}" != "true"; then
            python3 -m venv "${RUNNER_TEMP}/python"
            "${RUNNER_TEMP}/python/bin/pip" install --quiet -r scripts/requirements-material.txt
          fi
          echo "${RUNNER_TEMP}/python/bin" >> "${GITHUB_PATH}"
          echo "MOLNOTES_PYTHON=${RUNNER_TEMP}/python/bin/python3" >> "${GITHUB_ENV}"
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npm run build
      - run: npm run test:e2e
      - name: Summarize browser timings
        if: always() && hashFiles('test-results/results.json') != ''
        run: node scripts/test-timings.ts test-results/results.json >> "${GITHUB_STEP_SUMMARY}"

  publish:
    needs: [plan, check, e2e]
    if: always() && github.event_name == 'push' && needs.plan.result == 'success' && needs.check.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
        if: needs.plan.outputs.mode != 'docs'
      - run: npm run build
        if: needs.plan.outputs.mode != 'docs'
      - name: Verify the parent image passed Check
        if: needs.plan.outputs.mode == 'docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_SHA: ${{ github.event.before }}
        run: node scripts/checked-workflow.ts "${PARENT_SHA}"
      - name: Build, publish, and verify the exact image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.plan.outputs.mode }}
          PARENT_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "${DOCKER_CONFIG}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            rm -rf "${DOCKER_CONFIG}"
          }
          trap cleanup EXIT
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${repository}:${GITHUB_SHA}"
          if test "${MODE}" = docs; then
            # Documentation is not in the image: relabel the parent revision's
            # smoke-tested image so the update service can deploy this revision.
            parent="${repository}:${PARENT_SHA}"
            docker pull "${parent}"
            node scripts/resolve-published-image.ts "${repository}" "${PARENT_SHA}" "${parent}" >/dev/null
            printf 'FROM %s\n' "${parent}" | docker build \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${tag}" -
          else
            docker build \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${tag}" .
          fi
          docker push "${tag}"
          docker pull "${tag}"
          image="$(node scripts/resolve-published-image.ts "${repository}" "${GITHUB_SHA}" "${tag}")"
          if test "${MODE}" != docs; then node scripts/smoke-image.ts "${image}"; fi
          printf 'Published and smoke-tested %s\n' "${image}" >> "${GITHUB_STEP_SUMMARY}"
